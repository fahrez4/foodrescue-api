services:
  foodrescue-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodrescue-api
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - DB_DSN=${DB_DSN}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PAYMENT_GATEWAY_SERVER_KEY=${PAYMENT_GATEWAY_SERVER_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - foodrescue-net

networks:
  foodrescue-net:
    driver: bridge