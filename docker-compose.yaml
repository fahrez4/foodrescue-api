services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodrescue-api
    restart: unless-stopped
    ports:
      - "${PORT:-8091}:8091"
    environment:
      - PORT=${PORT:-8091}
      - GIN_MODE=${GIN_MODE:-release}
      - DB_DSN=${DB_DSN}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - foodrescue-net

networks:
  foodrescue-net:
    driver: bridge